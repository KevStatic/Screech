<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screech · Awaken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Special+Elite&amp;family=VT323&amp;display=swap">
<style>
body{margin:0;background:#050806}
a{color:#39ff7a}
a:hover{color:#b6ffcb}
.crt{position:relative;overflow:hidden}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,0.72) 100%)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:21;background:repeating-linear-gradient(to bottom,rgba(255,255,255,0.03) 0,rgba(255,255,255,0.03) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px)}
.glow{text-shadow:0 0 6px rgba(57,255,122,0.6),0 0 22px rgba(57,255,122,0.25)}
.flicker{animation:flicker 4s infinite}
@keyframes flicker{0%,18%,22%,60%,64%,100%{opacity:1}20%{opacity:.55}62%{opacity:.75}}
.warm{animation:warm 1.1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes warm{0%{transform:scaleY(.01) scaleX(.2);filter:brightness(4)}40%{transform:scaleY(.01) scaleX(1)}100%{transform:none;filter:none}}
.boot{animation:appear .05s linear backwards}
@keyframes appear{from{opacity:0}to{opacity:0}}
.bar{transform-origin:bottom;animation:bar 1.4s ease-in-out infinite alternate}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 rgba(57,255,122,0)}50%{box-shadow:0 0 28px rgba(57,255,122,.55)}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.calm *,.calm *::before,.calm *::after{animation:none !important;transition:none !important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="crt {{motionClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #050806; color: #39ff7a; font-family: 'VT323', monospace; display: flex; flex-direction: column; gap: 22px; padding: 20px 24px 32px">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <span style="font-size: 18px; letter-spacing: 2px; color: #5aa86c">SCREECH-87 · SPIRIT BOX</span>
    <button type="button" aria-pressed="{{exPressed}}" onClick="{{toggle}}" style="min-height: 44px; padding: 0 14px; background: transparent; border: 1px solid #5aa86c; border-radius: 6px; color: #39ff7a; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer">{{exLabel}}</button>
  </div>
  <div class="warm" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 40px">
    <h1 class="glow flicker" style="margin: 0; font-family: 'Creepster', cursive; font-weight: 400; font-size: 78px; letter-spacing: 6px; color: #39ff7a; line-height: 1">SCREECH</h1>
    <p style="margin: 0; font-family: 'Special Elite', monospace; font-size: 16px; color: #e9e4d4">a spirit box for your data</p>
  </div>
  <div aria-hidden="true" style="display: flex; align-items: flex-end; justify-content: space-between; height: 64px; padding: 0 4px; border-bottom: 1px solid #1f3a27">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="48">
      <div class="bar" style="width: 4px; height: {{b.h}}px; background: #39ff7a; opacity: 0.85; animation-delay: {{b.d}}"></div>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; font-size: 21px; min-height: 176px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
      <div class="boot" style="animation-delay: {{l.d}}; white-space: pre">&gt; {{l.text}}</div>
    </sc-for>
    <div class="boot" style="animation-delay: {{cursorDelay}}">&gt; <span class="cursor">_</span></div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <a href="Speak.dc.html" class="breathe" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 8px; background: #39ff7a; color: #050806; text-decoration: none; font-size: 34px; letter-spacing: 6px">AWAKEN</a>
    <p style="margin: 0; font-family: 'Special Elite', monospace; font-size: 15px; line-height: 1.45; color: #e9e4d4; text-align: center">The spirits need to hear you. Awakening asks for your microphone.</p>
    <p style="margin: 0; font-size: 17px; color: #5aa86c; text-align: center">Exorcise turns off flicker and motion.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var ex = !!s.exorcised;
    var self = this;
    var bars = [];
    for (var i = 0; i < 48; i++) {
      var v = Math.abs(Math.sin(i * 1.7) * 0.6 + Math.sin(i * 0.37) * 0.4);
      bars.push({ h: Math.round(8 + v * 56), d: (i * 0.04).toFixed(2) + 's' });
    }
    var text = [
      'SCREECH v1.0 · BOOTING',
      'CARRIER .............. DETECTED',
      'SPIRIT BAND 1875 Hz .. OPEN',
      'SEAL ENGINE AES-GCM .. READY',
      'SPIRITS PRESENT: 0'
    ];
    var lines = text.map(function (t, i) { return { text: t, d: (0.9 + i * 0.45).toFixed(2) + 's' }; });
    return {
      motionClass: ex ? 'calm' : '',
      exPressed: ex ? 'true' : 'false',
      exLabel: ex ? 'Exorcised' : 'Exorcise',
      toggle: function () { self.setState({ exorcised: !ex }); },
      bars: bars,
      lines: lines,
      cursorDelay: (0.9 + text.length * 0.45).toFixed(2) + 's'
    };
  }
}
</script>
</body>
</html>
