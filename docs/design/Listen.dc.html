<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screech · Listen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Special+Elite&amp;family=VT323&amp;display=swap">
<style>
body{margin:0;background:#050806}
a{color:#39ff7a}
a:hover{color:#b6ffcb}
.crt{position:relative;overflow:hidden}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,0.72) 100%)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:21;background:repeating-linear-gradient(to bottom,rgba(255,255,255,0.03) 0,rgba(255,255,255,0.03) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px)}
.glow{text-shadow:0 0 6px rgba(57,255,122,0.6),0 0 22px rgba(57,255,122,0.25)}
.bin{transform-origin:bottom;animation:bin .9s ease-in-out infinite alternate}
@keyframes bin{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.fall{animation:fall 2.2s linear infinite}
@keyframes fall{from{background-position:0 0,0 0}to{background-position:0 0,0 48px}}
.led-blink{animation:ledblink .8s steps(1) infinite}
@keyframes ledblink{50%{opacity:.25;box-shadow:none}}
.whisper{animation:whisper 3.5s ease-in-out infinite}
@keyframes whisper{0%,100%{opacity:1;letter-spacing:1px}45%{opacity:.6;letter-spacing:2px}50%{opacity:.85}}
.rec{animation:ledblink 1.2s steps(1) infinite}
.catch{animation:catch 4s ease-out infinite}
@keyframes catch{from{width:8%}to{width:92%}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.catch{width:56%}}
</style>
</helmet>
<div class="crt" style="width: 390px; height: 844px; box-sizing: border-box; background: #050806; color: #39ff7a; font-family: 'VT323', monospace; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 24px">
  <nav aria-label="Mode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Speak.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 6px; border: 1px solid #2f5a3a; color: #5aa86c; text-decoration: none; font-size: 24px; letter-spacing: 4px">SPEAK</a>
    <a href="Listen.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 6px; background: #39ff7a; color: #050806; text-decoration: none; font-size: 24px; letter-spacing: 4px">LISTEN</a>
  </nav>

  <div style="display: flex; align-items: center; gap: 10px">
    <span class="rec" aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #39ff7a; box-shadow: 0 0 10px #39ff7a"></span>
    <h1 class="glow" style="margin: 0; font-weight: 400; font-size: 30px; letter-spacing: 3px">SPIRIT BOX · OPEN</h1>
  </div>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
    <div style="position: relative; border: 1px solid #2f5a3a; border-radius: 8px; overflow: hidden; background: #07110a">
      <div aria-hidden="true" style="position: absolute; left: 35%; width: 42%; top: 0; bottom: 0; background: rgba(57,255,122,.07); border-left: 1px dashed #39ff7a; border-right: 1px dashed #39ff7a"></div>
      <div aria-hidden="true" style="position: relative; height: 120px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 6px">
        <sc-for list="{{bins}}" as="b" hint-placeholder-count="40">
          <div class="bin" style="width: 5px; height: {{b.h}}px; background: {{b.c}}; animation-delay: {{b.d}}; animation-duration: {{b.t}}"></div>
        </sc-for>
      </div>
      <div class="fall" aria-hidden="true" style="height: 96px; border-top: 1px solid #2f5a3a; background-image: linear-gradient(90deg, rgba(20,60,30,.5) 0%, rgba(20,60,30,.5) 35%, rgba(57,255,122,.55) 37%, rgba(57,255,122,.2) 50%, rgba(57,255,122,.6) 62%, rgba(57,255,122,.25) 75%, rgba(20,60,30,.5) 77%), repeating-linear-gradient(to bottom, rgba(5,8,6,0) 0, rgba(5,8,6,0) 6px, rgba(5,8,6,.85) 6px, rgba(5,8,6,.85) 12px, rgba(5,8,6,.3) 12px, rgba(5,8,6,.3) 24px, rgba(5,8,6,.9) 24px, rgba(5,8,6,.9) 30px, rgba(5,8,6,0) 30px, rgba(5,8,6,0) 48px); background-blend-mode: normal"></div>
      <span style="position: absolute; left: 37%; top: 6px; font-size: 16px; color: #39ff7a">SCREECH BAND</span>
    </div>
    <figcaption style="display: flex; justify-content: space-between; font-size: 17px; color: #5aa86c"><span>0 Hz</span><span>from 1.9 kHz</span><span>8 kHz</span></figcaption>
  </figure>

  <section aria-label="Signal meter" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #2f5a3a; border-radius: 12px; background: linear-gradient(#0c140e, #070b08)">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 20px; letter-spacing: 2px; color: #e9e4d4">K-II SIGNAL</span>
      <span style="font-size: 18px; color: #5aa86c">4 of 5</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; justify-items: center">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #2fd16a; box-shadow: 0 0 14px #2fd16a"></span>
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #8be04a; box-shadow: 0 0 14px #8be04a"></span>
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #f2d43a; box-shadow: 0 0 14px #f2d43a"></span>
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #ff9a2e; box-shadow: 0 0 14px #ff9a2e"></span>
      <span class="led-blink" aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #ff4a4a; box-shadow: 0 0 14px #ff4a4a"></span>
    </div>
    <p class="whisper" style="margin: 0; text-align: center; font-family: 'Special Elite', monospace; font-size: 18px; color: #e9e4d4">something is here…</p>
  </section>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 19px; color: #5aa86c"><span>Catching words</span><span>sealed · whisper</span></div>
    <div style="height: 6px; border-radius: 3px; background: #15291a; overflow: hidden"><div class="catch" style="height: 6px; background: #39ff7a"></div></div>
    <p style="margin: 0; font-size: 17px; color: #5aa86c">Screech's own sounds are muted while the box listens.</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="Reveal.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 10px; background: #39ff7a; color: #050806; text-decoration: none; font-size: 26px; letter-spacing: 2px">Let it speak</a>
    <a href="Cursed.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #ff8a7a; font-size: 19px">Preview: a tampered packet arrives</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var bins = [];
    for (var i = 0; i < 40; i++) {
      var inBand = i >= 14 && i <= 30;
      var base = inBand ? 55 + Math.abs(Math.sin(i * 2.3)) * 55 : 10 + Math.abs(Math.sin(i * 1.1)) * 26;
      bins.push({
        h: Math.round(base),
        c: inBand ? '#39ff7a' : '#2b5a37',
        d: ((i * 0.07) % 0.9).toFixed(2) + 's',
        t: (0.5 + Math.abs(Math.sin(i * 0.9)) * 0.7).toFixed(2) + 's'
      });
    }
    return { bins: bins };
  }
}
</script>
</body>
</html>
